<title>宝石早見帖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14161B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="宝石早見帖">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 片手で使う図鑑。上に検索、下にタブ。1カラム（最大 720px）で、石ごとに「査定カード」を縦に積む */
:root{
  --bg:#EEF0F2;          /* 鑑別トレーの灰白 */
  --surface:#FFFFFF;
  --sunk:#E3E6EA;
  --ink:#16181D;
  --muted:#5A616E;
  --line:#D5D9DF;
  --accent:#8A6A1F;      /* ルーペの真鍮 */
  --accent-ink:#FFFFFF;
  --accent-soft:#F1E7CF;
  --good:#256F47; --good-soft:#DDF0E4;
  --warn:#9A5B0B; --warn-soft:#FBEBD3;
  --bad:#A32A22;  --bad-soft:#F8DEDA;
  --info:#2D4F86; --info-soft:#DFE7F5;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
  --tab-h:60px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0F12; --surface:#17191E; --sunk:#202329; --ink:#ECEDEF; --muted:#9CA2AD; --line:#2B2F37;
  --accent:#D8B867; --accent-ink:#17140A; --accent-soft:#3A3120;
  --good:#7FD3A2; --good-soft:#163222; --warn:#F0B969; --warn-soft:#3A2A12; --bad:#F2928A; --bad-soft:#3E1A17; --info:#9DB8EA; --info-soft:#1B2740;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0F12; --surface:#17191E; --sunk:#202329; --ink:#ECEDEF; --muted:#9CA2AD; --line:#2B2F37;
  --accent:#D8B867; --accent-ink:#17140A; --accent-soft:#3A3120;
  --good:#7FD3A2; --good-soft:#163222; --warn:#F0B969; --warn-soft:#3A2A12; --bad:#F2928A; --bad-soft:#3E1A17; --info:#9DB8EA; --info-soft:#1B2740;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 16px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.04em;white-space:nowrap}
.brand small{font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.08em;margin-left:6px}
.top .spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--accent);font-weight:700}

main{padding-block:16px}
section.view{display:flex;flex-direction:column;gap:16px}

/* search + chips */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(127,127,127,.4)}

/* gem list */
.count{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 14px;text-decoration:none;color:inherit;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--sunk)}
.row .name{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.35}
.row .sub{font-size:12px;color:var(--muted);line-height:1.5}
.row .meta{text-align:right;font-size:11px;color:var(--muted);line-height:1.5}
.row .meta b{display:block;font-family:var(--f-mono);font-weight:500;color:var(--ink);font-size:12px}
.row > div{min-width:0}
.groupHead{padding:8px 14px;background:var(--sunk);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;border-top:1px solid var(--line)}
.groupHead:first-child{border-top:0}
.gemicon{width:48px;height:48px;display:block}

/* detail */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:13px}
.hero{display:grid;grid-template-columns:88px 1fr;gap:16px;align-items:center}
.hero .gemicon{width:88px;height:88px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,6.4vw,32px);line-height:1.25}
.hero .en{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);margin-top:6px}
.tag.add{background:var(--info-soft);color:var(--info)}
.keyline{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-weight:500}
.keyline .eyebrow{color:var(--accent);display:block;margin-bottom:2px}

.spec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.spec div{background:var(--surface);padding:10px 12px;min-width:0}
.spec dt{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.spec dd{margin:0;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.spec .wide{grid-column:1/-1}
@media (max-width:420px){.spec div{padding:8px 10px}.spec dd{font-size:13px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 .n{font-family:var(--f-mono);font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;font-weight:500}
.card ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.card li{padding-left:2px}
.card p{margin:0}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted);font-weight:700;font-size:12px;padding-top:2px}
.kv dd{margin:0;min-width:0}

.tr{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px dashed var(--line)}
.tr:first-of-type{border-top:0;padding-top:0}
.tr .h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.tr .nm{font-weight:700}
.tr .note{font-size:13px;color:var(--muted)}
.kind{font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;line-height:20px}
.kind.E{background:var(--good-soft);color:var(--good)}
.kind.T{background:var(--bad-soft);color:var(--bad)}
.kind.A{background:var(--warn-soft);color:var(--warn)}
.kind.N{background:var(--info-soft);color:var(--info)}
.imp{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.imp i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--sunk)}
.imp[data-l="1"] i:nth-child(-n+1),.imp[data-l="2"] i:nth-child(-n+2),.imp[data-l="3"] i:nth-child(-n+3){background:var(--bad)}
.imp[data-l="0"] i:first-child{background:var(--good)}

.origin{display:flex;flex-direction:column}
.origin div{display:grid;grid-template-columns:minmax(6.5em,34%) 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.origin div:first-child{border-top:0;padding-top:0}
.origin b{font-weight:700}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;background:var(--sunk);font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.idx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.idx div{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.idx span{display:block;font-size:10px;color:var(--muted);font-weight:700}
.idx b{font-family:var(--f-mono);font-weight:500;font-size:15px}

.warn{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px}
.warn b{color:var(--warn)}
.note-s{font-size:12px;color:var(--muted)}
.lab li{font-size:14px}

/* grade */
.grade{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12px}
.grade > *{background:var(--surface);padding:6px 8px}
.grade .gh{background:var(--sunk);font-weight:700;color:var(--muted);text-align:center}
.grade .gl{background:var(--sunk);font-weight:700;color:var(--muted)}

/* treat page */
.legend{display:grid;grid-template-columns:1fr;gap:8px}
.legend .card{gap:4px}
.tcard{display:flex;flex-direction:column;gap:6px}
.tcard .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tcard h3{font-size:16px}

/* identify page */
.flow{counter-reset:s;display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:28px 1fr;gap:10px}
.step::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px}
.step b{display:block}
.step span{font-size:13px;color:var(--muted)}
.ri-input{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ri-input input[type=number]{width:7.5em;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--f-mono);font-size:16px}
.ri-input input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
.scale{position:relative;height:auto}
.riRows{display:flex;flex-direction:column;gap:4px}
.riRow{display:grid;grid-template-columns:9.5em 1fr;gap:8px;align-items:center;font-size:12px;text-decoration:none;color:inherit}
.riRow .bar{position:relative;height:14px;background:var(--sunk);border-radius:3px}
.riRow .bar i{position:absolute;top:2px;bottom:2px;border-radius:2px;min-width:4px}
.riRow .bar .cur{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent)}
.riRow.hit{font-weight:700}
.riRow.dim{opacity:.45}
.riAxis{display:grid;grid-template-columns:9.5em 1fr;gap:8px;font-size:10px;color:var(--muted)}
.riAxis div{position:relative;height:14px}
.riAxis span{position:absolute;transform:translateX(-50%);font-family:var(--f-mono)}
.riAxis span:first-child{transform:none}
.riAxis span:last-child{transform:translateX(-100%)}

/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.qtext{font-size:18px;font-weight:700;line-height:1.55}
.qtext .mono{font-size:17px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;font-size:15px;line-height:1.5}
.opt.ok{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.opt.ng{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.opt:disabled{cursor:default}
.explain{font-size:14px;background:var(--sunk);border-radius:10px;padding:10px 12px}
.explain a{color:var(--accent);font-weight:700}
.btn{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.score{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.score b{font-family:var(--f-mono);color:var(--ink);font-weight:500}

.foot{font-size:11px;color:var(--muted);padding-top:8px;line-height:1.6}
.empty{padding:24px;text-align:center;color:var(--muted)}
a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.row{transition:background-color .15s,border-color .15s}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">宝石早見帖<small>GEM FIELD NOTES</small></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="表示テーマを切り替え">

    </button>
  </div>
</header>

<main class="wrap" id="app"></main>

  <nav aria-label="メニュー">
    <a href="#gems" data-tab="gems"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 4h12l4 5-10 11L2 9z"/><path d="M2 9h20M9 4l3 16 3-16"/></svg>図鑑</a>

  </nav>
</div>
